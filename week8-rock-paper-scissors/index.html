
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 8 - Rock Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f4f8;
            padding: 40px 15px;
        }

        main {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        button {
            background: #174c73;
            color: white;
            border: none;
            padding: 15px 25px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #106b9c;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <main>
        <h1>Rock, Paper, Scissors</h1>
        <p>Choose one option to play against the computer.</p>

        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>

        <p id="choices">Make your choice to start.</p>
        <p id="result"></p>
        <p id="score">You: 0 | Computer: 0 | Draws: 0</p>
    </main>

    <script>
        let playerScore = 0;
        let computerScore = 0;
        let draws = 0;

        function playGame(playerChoice) {

            // Generate a random computer choice
            const options = ["rock", "paper", "scissors"];
            const randomNumber = Math.floor(Math.random() * 3);
            const computerChoice = options[randomNumber];

            let result;

            // Check for a draw
            if (playerChoice === computerChoice) {
                result = "It's a draw!";
                draws++;
            }

            // Check whether the player wins
            else if (
                (playerChoice === "rock" && computerChoice === "scissors") ||
                (playerChoice === "paper" && computerChoice === "rock") ||
                (playerChoice === "scissors" && computerChoice === "paper")
            ) {
                result = "You win!";
                playerScore++;
            }

            // Otherwise the computer wins
            else {
                result = "Computer wins!";
                computerScore++;
            }

            // Display the choices and result
            document.getElementById("choices").textContent =
                "You chose " + playerChoice +
                ". The computer chose " + computerChoice + ".";

            document.getElementById("result").textContent = result;

            document.getElementById("score").textContent =
                "You: " + playerScore +
                " | Computer: " + computerScore +
                " | Draws: " + draws;
        }

        // Handle button clicks
        document.getElementById("rock").addEventListener("click", function() {
            playGame("rock");
        });

        document.getElementById("paper").addEventListener("click", function() {
            playGame("paper");
        });

        document.getElementById("scissors").addEventListener("click", function() {
            playGame("scissors");
        });
    </script>

</body>
</html>
